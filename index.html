<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduGenie</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="container">

    <h1>EduGenie</h1>

    <p class="subtitle">
        Google Gemini Powered Learning Assistant
    </p>


    <div class="card">

        <label>Select Task</label>

        <select id="task">

            <option value="qa">
                Ask Question
            </option>

            <option value="explain">
                Explain Topic
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summary">
                Summarize
            </option>

            <option value="learning">
                Learning Path
            </option>

        </select>


        <label>Enter your text</label>

        <textarea
            id="inputText"
            placeholder="Enter your question or topic..."
        ></textarea>


        <button onclick="submitTask()">
            Generate
        </button>

    </div>


    <div class="card result">

        <h2>Result</h2>

        <div id="result">
            Your result will appear here.
        </div>

    </div>

</div>


<script src="/static/app.js"></script>

</body>

</html>
